<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" font-family="Arial" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1000" height="230" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#555"/></marker></defs>
<text x="500.0" y="22" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#111" text-anchor="middle">Full lifecycle of a single service task (e.g. “Lock stock”)</text>
<rect x="30" y="70" width="150" height="60" rx="8" fill="#fdf1e0" stroke="#e8a33d" stroke-width="2"/><text x="105.0" y="93.0" font-family="Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111" text-anchor="middle">Zeebe Engine</text><text x="105.0" y="107.0" font-family="Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#111" text-anchor="middle">(job created)</text>
<rect x="280" y="70" width="150" height="60" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/><text x="355.0" y="93.0" font-family="Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111" text-anchor="middle">camunda_worker.py</text><text x="355.0" y="107.0" font-family="Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#111" text-anchor="middle">(job activated)</text>
<rect x="530" y="70" width="150" height="60" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/><text x="605.0" y="93.0" font-family="Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111" text-anchor="middle">Flask REST API</text><text x="605.0" y="107.0" font-family="Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#111" text-anchor="middle">POST /stock/lock</text>
<rect x="780" y="70" width="150" height="60" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/><text x="855.0" y="93.0" font-family="Arial,sans-serif" font-size="10.5" font-weight="bold" fill="#111" text-anchor="middle">camunda_worker.py</text><text x="855.0" y="107.0" font-family="Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#111" text-anchor="middle">return {...}</text>
<line x1="180" y1="100" x2="280" y2="100" stroke="#34a853" stroke-width="1.8" marker-end="url(#a)"/>
<text x="230" y="86" font-family="Arial,sans-serif" font-size="9.5" font-weight="normal" fill="#34a853" text-anchor="middle">gRPC: poll</text>
<line x1="430" y1="100" x2="530" y2="100" stroke="#4285f4" stroke-width="1.8" marker-end="url(#a)"/>
<text x="480" y="86" font-family="Arial,sans-serif" font-size="9.5" font-weight="normal" fill="#4285f4" text-anchor="middle">HTTP POST</text>
<line x1="680" y1="100" x2="780" y2="100" stroke="#4285f4" stroke-width="1.8" marker-end="url(#a)"/>
<text x="730" y="86" font-family="Arial,sans-serif" font-size="9.5" font-weight="normal" fill="#4285f4" text-anchor="middle">HTTP 201</text>
<path d="M855,130 C855,190 205,190 105,130" stroke="#34a853" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="480" y="205" font-family="Arial,sans-serif" font-size="10" font-weight="normal" fill="#34a853" text-anchor="middle">gRPC: complete job (lock_id written back as a process variable)</text>
</svg>